; Location used for the weather forecast (degrees).
[location]
latitude=48.1374
longitude=11.5755

; Alarm: switches the light on at this time (HH:mm) on the listed days.
[alarm]
time=06:45
days=Mon,Tue,Wed,Thu,Fri

; Night mode: after 5 minutes without input between start and end the screen only shows a dark clock.
; It never starts while the light is on.
[nightmode]
enabled=true
start=22:00
end=06:00
