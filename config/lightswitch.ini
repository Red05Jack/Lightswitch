; Weather location (name and coordinates in degrees); changed in the settings on the device.
[location]
name=Graz
latitude=47.0707
longitude=15.4395

; Alarm: switches the light on on the listed days at the time of the weekday (HH:mm).
; "time" is the default for all days, mon..sun override it; "enabled" switches the whole alarm.
[alarm]
enabled=true
time=06:45
days=Mon,Tue,Wed,Thu,Fri

; Night mode: after 5 minutes without input between start and end the screen only shows a dark clock.
; It never starts while the light is on.
[nightmode]
enabled=true
start=22:00
end=06:00
